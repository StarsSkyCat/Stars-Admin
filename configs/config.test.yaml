# APP_ENV=test 时覆盖基础配置；本文件不会自动创建或启动数据库/Redis。
# 集成测试会回退迁移并清理数据，必须连接专用测试服务，不能指向开发或生产资源。
app:
  env: test                  # 测试环境记录，实际环境由 APP_ENV 选择。
database:
  dbname: stars_admin_test    # 集成测试严格核对该库名，还需 STARS_INTEGRATION=1。
log:
  level: error               # 降低测试日志噪声。
  format: json               # 结构化日志，便于断言和排查。
  file: ""                  # 不写本地日志文件，避免并发测试共享日志路径。
swagger:
  enabled: false             # 测试环境默认不挂载文档；文档开关有独立测试。
# 数据库账号/密码、Redis地址等仍沿用基础配置，隔离测试入口或本机环境变量负责覆盖。
