# 请求：sub 为 user:{id}，obj 为后端声明的完整权限标识，如 sys:user:list。
[request_definition]
r = sub, obj

# 策略：sub 为 role:{id}，obj 为该角色被授予的权限标识。
[policy_definition]
p = sub, obj

# 用户到角色的成员关系，命名空间避免相同数字 ID 串权。
[role_definition]
g = _, _

# 至少存在一条允许策略才通过；未匹配默认拒绝。
[policy_effect]
e = some(where (p.eft == allow))

# 先匹配角色成员关系，再精确比较权限，不使用路径通配符。
# 认证、首登改密、admin 保护和数据范围由业务安全链路另行校验。
[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj
